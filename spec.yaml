  delivery_sync:
    description: "CDA full + incremental sync (drives the local SQLite mirror) (CDA tier). Surfaced as 'delivery-sync' to avoid collision with the built-in 'sync' command that hydrates the local mirror."
    tier: cda
    endpoints:
      run:
        method: GET
        path: "/spaces/{space_id}/environments/{environment_id}/sync"
        description: "Full or incremental sync. Use --initial=true once, then --sync-token from the prior nextSyncToken."
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: initial
            type: bool
            description: "Start a fresh full sync (cannot combine with sync_token)"
          - name: sync_token
            flag_name: sync-token
            type: string
            description: "Previous nextSyncToken to resume incremental sync"
          - name: type
            type: string
            description: "Limit to a single entity type (Entry|Asset|Deletion|DeletedEntry|DeletedAsset)"
          - name: content_type
            flag_name: content-type
            type: string
            description: "Limit Entry sync to a specific content type"
          - name: resolveLinks
            type: bool
            default: true
            description: "Resolve linked entries inline"
        response:
          type: object
          item: SyncResponse
        pagination:
          type: cursor
          cursor_field: nextPageUrl
          has_more_field: nextPageUrl

