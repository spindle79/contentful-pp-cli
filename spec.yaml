          item: Entry
      create:
        method: POST
        path: "/spaces/{space_id}/environments/{environment_id}/entries"
        description: "Create an entry (requires X-Contentful-Content-Type header)"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
        body:
          - name: fields
            type: string
            required: true
            description: "Entry fields as locale-keyed JSON object (use @file.json)"
        response:
          type: object
          item: Entry
      update:
        method: PUT
        path: "/spaces/{space_id}/environments/{environment_id}/entries/{entry_id}"
        description: "Update an entry (requires X-Contentful-Version header)"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: entry_id
            type: string
            required: true
            positional: true
            description: "Entry ID"
        body:
          - name: fields
            type: string
            required: true
            description: "Entry fields as locale-keyed JSON object"
        response:
          type: object
          item: Entry
      delete:
        method: DELETE
        path: "/spaces/{space_id}/environments/{environment_id}/entries/{entry_id}"
        description: "Delete an entry"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: entry_id
            type: string
            required: true
            positional: true
            description: "Entry ID"
      publish:
        method: PUT
        path: "/spaces/{space_id}/environments/{environment_id}/entries/{entry_id}/published"
        description: "Publish an entry (no body; requires X-Contentful-Version header)"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: entry_id
            type: string
            required: true
            positional: true
            description: "Entry ID"
        response:
          type: object
          item: Entry
      unpublish:
        method: DELETE
        path: "/spaces/{space_id}/environments/{environment_id}/entries/{entry_id}/published"
        description: "Unpublish an entry"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: entry_id
            type: string
            required: true
            positional: true
            description: "Entry ID"
        response:
          type: object
          item: Entry
      archive:
        method: PUT
        path: "/spaces/{space_id}/environments/{environment_id}/entries/{entry_id}/archived"
        description: "Archive an entry (no body)"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: entry_id
            type: string
            required: true
            positional: true
            description: "Entry ID"
        response:
          type: object
          item: Entry
      unarchive:
        method: DELETE
        path: "/spaces/{space_id}/environments/{environment_id}/entries/{entry_id}/archived"
        description: "Unarchive an entry"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: entry_id
            type: string
            required: true
            positional: true
            description: "Entry ID"
        response:
          type: object
          item: Entry
      references:
        method: GET
        path: "/spaces/{space_id}/environments/{environment_id}/entries/{entry_id}/references"
        description: "Get depth-1 references for an entry (online only — for deep refs use the local mirror)"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: entry_id
            type: string
            required: true
            positional: true
            description: "Entry ID"
          - name: include
            type: int
            default: 2
            description: "Inclusion depth (1-10)"
        response:
          type: array
          item: Entry
        response_path: items

  entry_snapshots:
    description: "Read entry snapshots (history) (CMA)"
    endpoints:
      list:
        method: GET
        path: "/spaces/{space_id}/environments/{environment_id}/entries/{entry_id}/snapshots"
        description: "List snapshots for an entry"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: entry_id
            type: string
            required: true
            positional: true
            description: "Entry ID"
          - name: limit
            type: int
            default: 100
            description: "Max results"
          - name: skip
            type: int
            default: 0
            description: "Pagination offset"
        response:
          type: array
          item: Snapshot
        pagination:
          type: offset
          has_more_field: total
        response_path: items
      get:
        method: GET
        path: "/spaces/{space_id}/environments/{environment_id}/entries/{entry_id}/snapshots/{snapshot_id}"
        description: "Get a single entry snapshot"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
