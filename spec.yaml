name: contentful
description: "Contentful CLI — every Contentful API command, plus a local SQLite mirror that makes orphan detection, full environment diffs, and SQL-driven bulk publishing one-liners."
version: "0.1.0"
base_url: "https://api.contentful.com"
health_check_path: "/spaces"

# 134 endpoint tools is over the 50-threshold. Use the Cloudflare pattern:
# - Stdio + HTTP transport so cloud-hosted agents can reach the server.
# - Code-orchestration (search + execute pair) covers the full surface in ~1K tokens.
# - Hide raw per-endpoint mirrors so they don't co-exist with the orchestration pair.
mcp:
  transport: [stdio, http]
  orchestration: code
  endpoint_tools: hidden

required_headers:
  - name: Content-Type
    value: "application/vnd.contentful.management.v1+json"
  - name: X-Contentful-User-Agent
    value: "contentful-pp-cli/0.1.0"

auth:
  type: bearer_token
  header: "Authorization"
  format: "Bearer {token}"
  env_vars:
    - CONTENTFUL_MANAGEMENT_TOKEN
  in: header

tier_routing:
  default_tier: cma
  tiers:
    cma:
      auth:
        type: bearer_token
        header: "Authorization"
        format: "Bearer {token}"
        env_vars: [CONTENTFUL_MANAGEMENT_TOKEN]
    cda:
      # Cross-host vs api.contentful.com is intentional — distinct delivery host & token.
      allow_cross_host_auth: true
      auth:
        type: bearer_token
        header: "Authorization"
        format: "Bearer {token}"
        env_vars: [CONTENTFUL_DELIVERY_TOKEN]
      base_url: "https://cdn.contentful.com"
    cpa:
      # Cross-host vs api.contentful.com is intentional — distinct preview host & token.
      allow_cross_host_auth: true
      auth:
        type: bearer_token
        header: "Authorization"
        format: "Bearer {token}"
        env_vars: [CONTENTFUL_PREVIEW_TOKEN]
      base_url: "https://preview.contentful.com"
    gql:
      # Cross-host vs api.contentful.com is intentional — distinct GraphQL host (uses CDA token).
      allow_cross_host_auth: true
      auth:
        type: bearer_token
        header: "Authorization"
        format: "Bearer {token}"
        env_vars: [CONTENTFUL_DELIVERY_TOKEN]
      base_url: "https://graphql.contentful.com"

config:
  format: toml
  path: "~/.config/contentful-pp-cli/config.toml"

resources:

  # ============================================================
  # CMA TIER (default — uses CONTENTFUL_MANAGEMENT_TOKEN)
  # ============================================================

  spaces:
    description: "Manage Contentful spaces (CMA)"
    endpoints:
      list:
        method: GET
        path: "/spaces"
        description: "List all spaces accessible to the token"
        params:
          - name: limit
            type: int
            default: 100
            description: "Max results (1-1000)"
          - name: skip
            type: int
            default: 0
            description: "Pagination offset"
        response:
          type: array
          item: Space
        pagination:
          type: offset
          has_more_field: total
        response_path: items
      get:
        method: GET
        path: "/spaces/{space_id}"
        description: "Get a space by ID"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
        response:
          type: object
          item: Space
      create:
        method: POST
        path: "/spaces"
        description: "Create a new space"
        body:
          - name: name
            type: string
            required: true
            description: "Space name"
          - name: defaultLocale
            type: string
            description: "Default locale code (e.g., en-US)"
          - name: organizationId
            type: string
            description: "Organization ID that will own the space"
        response:
          type: object
          item: Space
      update:
        method: PUT
        path: "/spaces/{space_id}"
        description: "Update a space (requires X-Contentful-Version header)"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
        body:
          - name: name
            type: string
            description: "Space name"
        response:
          type: object
          item: Space
      delete:
        method: DELETE
        path: "/spaces/{space_id}"
        description: "Delete a space"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"

  environments:
    description: "Manage environments within a space (CMA)"
    endpoints:
      list:
        method: GET
        path: "/spaces/{space_id}/environments"
        description: "List environments in a space"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID (or set CONTENTFUL_SPACE_ID)"
          - name: limit
            type: int
            default: 100
            description: "Max results"
          - name: skip
            type: int
            default: 0
            description: "Pagination offset"
        response:
          type: array
          item: Environment
        pagination:
          type: offset
          has_more_field: total
        response_path: items
      get:
        method: GET
        path: "/spaces/{space_id}/environments/{environment_id}"
        description: "Get an environment by ID"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
        response:
          type: object
          item: Environment
      create:
        method: PUT
        path: "/spaces/{space_id}/environments/{environment_id}"
        description: "Create an environment (optionally branched from a source)"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "New environment ID"
        body:
          - name: name
            type: string
            required: true
            description: "Environment display name"
        response:
          type: object
          item: Environment
      delete:
        method: DELETE
        path: "/spaces/{space_id}/environments/{environment_id}"
        description: "Delete an environment"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"

  environment_aliases:
    description: "Manage environment aliases (CMA)"
    endpoints:
      list:
        method: GET
        path: "/spaces/{space_id}/environment_aliases"
        description: "List environment aliases"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
        response:
          type: array
          item: EnvironmentAlias
        response_path: items
      get:
        method: GET
        path: "/spaces/{space_id}/environment_aliases/{alias_id}"
        description: "Get an environment alias by ID"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: alias_id
            type: string
            required: true
            positional: true
            description: "Environment alias ID"
        response:
          type: object
          item: EnvironmentAlias
      update:
        method: PUT
        path: "/spaces/{space_id}/environment_aliases/{alias_id}"
        description: "Update an environment alias to point to a different environment"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: alias_id
            type: string
            required: true
            positional: true
            description: "Environment alias ID"
        body:
          - name: environment.sys.id
            type: string
            required: true
            description: "Target environment ID the alias should point to"
        response:
          type: object
          item: EnvironmentAlias

  content_types:
    description: "Manage content types (CMA)"
    endpoints:
      list:
        method: GET
        path: "/spaces/{space_id}/environments/{environment_id}/content_types"
        description: "List content types in an environment"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: limit
            type: int
            default: 100
            description: "Max results (1-1000)"
          - name: skip
            type: int
            default: 0
            description: "Pagination offset"
          - name: order
            type: string
            description: "Order by field (e.g., -sys.updatedAt)"
        response:
          type: array
          item: ContentType
        pagination:
          type: offset
          has_more_field: total
        response_path: items
      get:
        method: GET
        path: "/spaces/{space_id}/environments/{environment_id}/content_types/{content_type_id}"
        description: "Get a content type by ID"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: content_type_id
            type: string
            required: true
            positional: true
            description: "Content type ID"
        response:
          type: object
          item: ContentType
      create:
        method: PUT
        path: "/spaces/{space_id}/environments/{environment_id}/content_types/{content_type_id}"
        description: "Create a content type with the given ID"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: content_type_id
            type: string
            required: true
            positional: true
            description: "Content type ID to create"
        body:
          - name: name
            type: string
            required: true
            description: "Content type display name"
          - name: displayField
            type: string
            description: "Field ID used as the entry display title"
          - name: description
            type: string
            description: "Content type description"
          - name: fields
            type: string
            required: true
            description: "Field definitions as JSON array (use @file.json)"
        response:
          type: object
          item: ContentType
      update:
        method: PUT
        path: "/spaces/{space_id}/environments/{environment_id}/content_types/{content_type_id}"
        description: "Update a content type (requires X-Contentful-Version header)"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: content_type_id
            type: string
            required: true
            positional: true
            description: "Content type ID"
        body:
          - name: name
            type: string
            description: "Content type display name"
          - name: displayField
            type: string
            description: "Field ID used as the entry display title"
          - name: description
            type: string
            description: "Content type description"
          - name: fields
            type: string
            description: "Field definitions as JSON array"
        response:
          type: object
          item: ContentType
      delete:
        method: DELETE
        path: "/spaces/{space_id}/environments/{environment_id}/content_types/{content_type_id}"
        description: "Delete a content type"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: content_type_id
            type: string
            required: true
            positional: true
            description: "Content type ID"
      publish:
        method: PUT
        path: "/spaces/{space_id}/environments/{environment_id}/content_types/{content_type_id}/published"
        description: "Publish a content type (no body; requires X-Contentful-Version header)"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: content_type_id
            type: string
            required: true
            positional: true
            description: "Content type ID"
        response:
          type: object
          item: ContentType
      unpublish:
        method: DELETE
        path: "/spaces/{space_id}/environments/{environment_id}/content_types/{content_type_id}/published"
        description: "Unpublish a content type"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: content_type_id
