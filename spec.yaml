          item: EditorInterface
        response_path: items
      get:
        method: GET
        path: "/spaces/{space_id}/environments/{environment_id}/content_types/{content_type_id}/editor_interface"
        description: "Get the editor interface for a content type"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: content_type_id
            type: string
            required: true
            positional: true
            description: "Content type ID"
        response:
          type: object
          item: EditorInterface
      update:
        method: PUT
        path: "/spaces/{space_id}/environments/{environment_id}/content_types/{content_type_id}/editor_interface"
        description: "Update the editor interface for a content type (requires X-Contentful-Version header)"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: content_type_id
            type: string
            required: true
            positional: true
            description: "Content type ID"
        body:
          - name: controls
            type: string
            description: "Field control configurations as JSON array"
          - name: sidebar
            type: string
            description: "Sidebar widgets as JSON array"
        response:
          type: object
          item: EditorInterface

  content_type_snapshots:
    description: "Read content type snapshots (history) (CMA)"
    endpoints:
      list:
        method: GET
        path: "/spaces/{space_id}/environments/{environment_id}/content_types/{content_type_id}/snapshots"
        description: "List snapshots for a content type"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: content_type_id
            type: string
            required: true
            positional: true
            description: "Content type ID"
          - name: limit
            type: int
            default: 100
            description: "Max results"
          - name: skip
            type: int
            default: 0
            description: "Pagination offset"
        response:
          type: array
          item: Snapshot
        pagination:
          type: offset
          has_more_field: total
        response_path: items
      get:
        method: GET
        path: "/spaces/{space_id}/environments/{environment_id}/content_types/{content_type_id}/snapshots/{snapshot_id}"
        description: "Get a single content type snapshot"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: content_type_id
            type: string
            required: true
            positional: true
            description: "Content type ID"
          - name: snapshot_id
            type: string
            required: true
            positional: true
            description: "Snapshot ID"
        response:
          type: object
          item: Snapshot

  entries:
    description: "Manage entries (CMA)"
    endpoints:
      list:
        method: GET
        path: "/spaces/{space_id}/environments/{environment_id}/entries"
        description: "List entries in an environment"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID (or set CONTENTFUL_SPACE_ID)"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID (or set CONTENTFUL_ENVIRONMENT_ID)"
          - name: limit
            type: int
            default: 100
            description: "Max entries (1-1000)"
          - name: skip
            type: int
            default: 0
            description: "Pagination offset"
          - name: order
            type: string
            description: "Order by field (e.g., -sys.updatedAt)"
          - name: content_type
            flag_name: content-type
            type: string
            description: "Filter by content type ID"
          - name: query
            type: string
            description: "Full-text search query (matches across all string fields)"
          - name: locale
            type: string
            description: "Locale to fetch (use '*' for all locales)"
          - name: select
            type: string
            description: "Comma-separated list of fields to project (e.g., sys.id,fields.title)"
        response:
          type: array
          item: Entry
        pagination:
          type: offset
          has_more_field: total
        response_path: items
      get:
        method: GET
        path: "/spaces/{space_id}/environments/{environment_id}/entries/{entry_id}"
        description: "Get an entry by ID"
        params:
          - name: space_id
            type: string
            required: true
            positional: true
            description: "Space ID"
          - name: environment_id
            type: string
            required: true
            positional: true
            description: "Environment ID"
          - name: entry_id
            type: string
            required: true
            positional: true
            description: "Entry ID"
          - name: locale
            type: string
            description: "Locale to fetch (use '*' for all locales)"
        response:
