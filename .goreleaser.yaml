version: 2
project_name: contentful-pp-cli
changelog:
  disable: true
builds:
  - id: contentful-pp-cli
    main: ./cmd/contentful-pp-cli
    binary: contentful-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X contentful-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: contentful-pp-mcp
    main: ./cmd/contentful-pp-mcp
    binary: contentful-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: contentful-pp-cli
    repository:
      owner: user
      name: homebrew-tap
    homepage: "https://github.com/user/contentful-pp-cli"
    description: "Every Contentful API command, plus a local SQLite mirror that makes orphan detection, full environment diffs, and..."
    install: |
      bin.install "contentful-pp-cli"
      bin.install "contentful-pp-mcp"
